project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"          # only .qmd files, so the old Jekyll .md files are ignored for now
  resources:
    - CNAME
    - robots.txt
    - "static/**"
    - "documents/**"       # CV, syllabi, lecture notes, pronunciation guide (PDFs)

website:
  title: "Deewang Bhamidipati"
  description: "Deewang, a mathematician"
  site-url: https://bdeewang.com
  favicon: static/favicon/bdeewang-favicon.png
  search: true
  navbar:
    collapse: false     # never fold the menu into a ☰ button; it wraps like the old site
    left:
      - text: Research          # drop-down; on these pages it reads "Research > Articles" etc.
        menu:
          - text: Articles
            href: research.qmd
          - text: Travel
            href: travel.qmd
      - text: Teaching
        href: teaching.qmd
      - text: Service
        href: service.qmd
      - text: Writing
        href: writing.qmd
    right:
      - text: "(&#94;_&#94;)"     # carets written as &#94; so Quarto doesn't read ^_^ as superscript
        href: https://www.youtube.com/watch?v=z9Ug-3qhrwY
  page-footer:
    left: "[Top ↑](#)"
    right: "© Deewang Bhamidipati 2026"

format:
  html:
    theme: [cosmo, theme.scss, theme-dark.scss]   # dark-only site (no light/dark toggle)
    toc: false
    page-layout: custom      # single column, width set in theme.scss ($page-width)
    callout-icon: false      # no ⓘ/⚠ symbols in front of callout titles
    link-external-newwindow: true   # links to other websites open in a new tab
    link-external-icon: false       # …without adding a little arrow icon after them
    include-in-header:
      - text: '<script>document.documentElement.classList.add("js-header-title");</script>'
    include-after-body:
      - _header-title.html     # page title into the header
      - _about-photo.html      # rotating homepage photo (does nothing on other pages)
      - text: |
          <script>
            // PDFs on this site (CV, syllabi, notes, pronunciation) and outside links in the header, e.g. (^_^),
            // also open in a new tab
            document.querySelectorAll('a[href$=".pdf"], #quarto-header a[href^="http"]').forEach(function (a) {
              a.target = "_blank"; a.rel = "noopener";
            });
          </script>
