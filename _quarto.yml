project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"          # only .qmd files, so the old Jekyll .md files are ignored for now
  resources:
    - CNAME
    - robots.txt
    - "static/**"

website:
  title: "Deewang Bhamidipati"
  description: "Deewang, a mathematician"
  site-url: https://bdeewang.com
  favicon: static/favicon/bdeewang-favicon.png
  search: true
  navbar:
    collapse: false     # never fold the menu into a ☰ button; it wraps like the old site
    left:
      - text: Research
        href: research.qmd
      - text: Teaching
        href: teaching.qmd
      - text: Service
        href: service.qmd
      - text: Resources
        href: resources.qmd
    right:
      - text: "(^_^)"
        href: https://www.youtube.com/watch?v=z9Ug-3qhrwY
  page-footer:
    left: "[Top ↑](#)"
    right: "© Deewang Bhamidipati 2026"

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme.scss, theme-dark.scss]
    respect-user-color-scheme: true   # follow the visitor's system light/dark setting; the toggle still works
    toc: false
