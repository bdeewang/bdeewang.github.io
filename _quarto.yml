project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"          # only .qmd files, so the old Jekyll .md files are ignored for now
  resources:
    - CNAME
    - robots.txt
    - "static/**"

website:
  title: "Deewang Bhamidipati"
  description: "Deewang, a mathematician"
  site-url: https://bdeewang.com
  favicon: static/favicon/bdeewang-favicon.png
  search: true
  navbar:
    collapse: false     # never fold the menu into a ☰ button; it wraps like the old site
    left:
      - text: Research
        href: research.qmd
      - text: Teaching
        href: teaching.qmd
      - text: Service
        href: service.qmd
    right:
      - text: "(^_^)"
        href: https://www.youtube.com/watch?v=z9Ug-3qhrwY
  page-footer:
    left: "[Top ↑](#)"
    right: "© Deewang Bhamidipati 2026"

format:
  html:
    theme: [cosmo, theme.scss, theme-dark.scss]   # dark-only site (no light/dark toggle)
    toc: false
    callout-icon: false      # no ⓘ/⚠ symbols in front of callout titles
    include-in-header:
      - text: '<script>document.documentElement.classList.add("js-header-title");</script>'
    include-after-body:
      - _header-title.html     # page title into the header
      - _about-photo.html      # rotating homepage photo (does nothing on other pages)
